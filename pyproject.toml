[project]
name = "fannagent-pgvector"
version = "0.1.0"
description = "Physical pgvector observation and stopping extension for FANNAgent"
requires-python = ">=3.12,<3.14"
readme = "README.md"
dependencies = ["fannagent>=0.2,<0.3", "psycopg[binary]>=3.2,<4"]

[project.optional-dependencies]
dev = ["pytest>=8.4,<10", "ruff>=0.12,<1", "mypy>=1.18,<2"]

[project.entry-points."fannagent.backends"]
pgvector = "fannagent_pgvector.extension:extension"

[project.scripts]
fannagent-pgvector-build = "fannagent_pgvector.build:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fannagent_pgvector"]

[tool.uv.sources]
fannagent = {path = "../agent", editable = true}

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs Docker and instrumented engine images"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
